# Keep plain English commits as well as Conventional Commits.
[changelog]
header = ""
body = """
{% for group, commits in commits | group_by(attribute="group") %}
## {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
{{ commit.message | split(pat="\n") | first | trim }}\
{% endfor %}

{% endfor %}
"""
footer = """

## License: source code and binaries

- **Original source code:** MIT. Third-party source files retain their own licenses.
- **Downloaded binaries:** Both the addon-only and demo packages include the Kyber SDK.
  The combined public binaries are distributed under **AGPL-3.0-or-later**, not MIT alone.
- **Commercial alternative:** The included Kyber components may instead be used under
  a valid **Kyber SAS commercial license** covering the versions, modifications,
  use, and distribution involved. This download does not grant commercial rights.

Under the AGPL option, distributors must provide the complete Corresponding Source,
including the matching SDK sources, modifications, and build scripts.
Other dependencies retain their own terms under either option.

Read the `BINARY_LICENSE.md` included in the package and its `licenses/` notices.
See also [binary licensing](https://github.com/shiena/godot-kyber/blob/main/BINARY_LICENSE.md)
and [Kyber commercial licensing](https://kyber.tech/).
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
commit_parsers = [
    { message = '^chore\(release\)', skip = true },
    { message = '^Initialize reository$', skip = true },
    { message = '(?i)^(fix|repair)\b', group = "<!-- 1 -->Bug fixes" },
    { message = '(?i)^(perf|optimize)\b', group = "<!-- 2 -->Performance" },
    { message = '(?i)^(refactor)\b', group = "<!-- 3 -->Refactoring" },
    { message = '(?i)^(docs?|document)\b', group = "<!-- 4 -->Documentation" },
    { message = '(?i)^(test|add integration and platform tests)\b', group = "<!-- 5 -->Testing" },
    { message = '(?i)^(ci|add ci and release workflows)\b', group = "<!-- 6 -->CI/CD" },
    { message = '(?i)^(feat|add|implement)\b', group = "<!-- 0 -->Features" },
    { message = '.*', group = "<!-- 7 -->Other changes" },
]
filter_commits = false
tag_pattern = "v[0-9].*"
topo_order = false
sort_commits = "oldest"
